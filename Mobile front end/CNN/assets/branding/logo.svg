<?xml version="1.0" encoding="UTF-8"?>
<!--
  DefectScan brand mark — magnifier over a cracked wall.
  Master/source artifact (matches lib/widgets/app_logo.dart). NOT loaded at
  runtime; use it to export app icons / favicons. Brand: blue #1B3A6B, amber #F5A623.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <clipPath id="wall">
      <rect x="6" y="6" width="66" height="66" rx="10"/>
    </clipPath>
  </defs>

  <!-- Wall tile -->
  <rect x="6" y="6" width="66" height="66" rx="10" fill="#1B3A6B" fill-opacity="0.10"/>

  <!-- Mortar / brick courses (clipped to the wall) -->
  <g clip-path="url(#wall)" stroke="#1B3A6B" stroke-opacity="0.28" stroke-width="1.8" stroke-linecap="round">
    <line x1="6" y1="30" x2="72" y2="30"/>
    <line x1="6" y1="52" x2="72" y2="52"/>
    <line x1="30" y1="6" x2="30" y2="30"/>
    <line x1="52" y1="30" x2="52" y2="52"/>
    <line x1="24" y1="52" x2="24" y2="72"/>
  </g>

  <!-- Crack -->
  <path d="M40 6 L34 22 L47 33 L39 50 L48 66 M47 33 L60 38"
        stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifier handle -->
  <line x1="79.6" y1="79.6" x2="93" y2="93" stroke="#1B3A6B" stroke-width="11" stroke-linecap="round"/>

  <!-- Magnifier glass -->
  <circle cx="64" cy="64" r="22" fill="#FFFFFF"/>
  <circle cx="64" cy="64" r="22" fill="#2E5AA0" fill-opacity="0.12"/>

  <!-- Glass highlight -->
  <path d="M51.8 58 A13.6 13.6 0 0 1 65.2 50.4"
        stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Magnifier ring -->
  <circle cx="64" cy="64" r="22" stroke="#1B3A6B" stroke-width="7.5"/>
</svg>
